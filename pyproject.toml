[project]
name = "notegen"
version = "2.4.0"
description = "Convert YouTube videos, playlists, and web pages into Obsidian markdown notes using LLMs"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Srimoneyshankar Ajith", email = "moneytosms@gmail.com" }]
requires-python = ">=3.11"
keywords = ["obsidian", "notes", "youtube", "llm", "markdown", "knowledge-management"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Utilities",
    "Topic :: Text Processing :: Markup :: Markdown",
]
dependencies = [
    "typer>=0.12",
    "httpx>=0.27",
    "trafilatura>=1.12",
    "youtube-transcript-api>=0.6",
    "yt-dlp>=2024.1",
    "litellm>=1.40",
    "tiktoken>=0.7",
    "rich>=13",
    "pyyaml>=6",
    "beautifulsoup4>=4.12",
    "anyio>=4",
    "watchfiles>=1.2.0",
    "pydantic>=2.13.4",
    "loguru>=0.7.3",
    "pypandoc>=1.17",
    "markdown-it-py[html,linkify]>=4.2.0",
]

[project.urls]
Homepage = "https://github.com/moneytosms/notegen"
"Bug Tracker" = "https://github.com/moneytosms/notegen/issues"

[project.scripts]
notegen = "notes_gen.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["notes_gen"]

[tool.hatch.build.targets.sdist]
include = ["notes_gen/", "tests/", "README.md", "pyproject.toml"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["E501", "F841"]
"notes_gen/cli.py" = ["E402"]  # logging must suppress litellm before notes_gen import

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "pytest-anyio>=0.0.0",
    "ruff>=0.5",
    "tenacity>=9.1.4",
    "pyrefly>=1.0.0",
]
