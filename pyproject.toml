[project]
name = "notegen"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12",
    "httpx>=0.27",
    "trafilatura>=1.12",
    "youtube-transcript-api>=0.6",
    "yt-dlp>=2024.1",
    "litellm>=1.40",
    "tiktoken>=0.7",
    "rich>=13",
    "pyyaml>=6",
    "beautifulsoup4>=4.12",
    "anyio>=4",
]

[project.scripts]
notegen = "notes_gen.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["notes_gen"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["E501", "F841"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "pytest-anyio>=0.0.0",
    "ruff>=0.5",
]
