<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="t d">
  <title id="t">notegen</title>
  <desc id="d">notegen turns YouTube videos, playlists and web pages into structured Obsidian notes. A sample note shows YAML frontmatter, a wikilink, a callout and a table.</desc>
  <rect width="1200" height="420" rx="26" fill="#1e1b2e"/>
  <rect x="0.5" y="0.5" width="1199" height="419" rx="25.5" fill="none" stroke="#352f52"/>
  <g transform="translate(64 64)">
    <text font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="16" letter-spacing="3" fill="#8f86c2">VIDEOS · PLAYLISTS · WEB PAGES</text>
    <text y="96" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="88" font-weight="800" fill="#f1eefc" letter-spacing="-3">notegen</text>
    <text y="154" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="28" fill="#c4bde6">Lecture-style notes, not summaries.</text>
    <text y="192" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="28" font-weight="700" fill="#a78bfa">Wikilinks, callouts, Mermaid, math.</text>
    <g transform="translate(0 244)" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="18">
      <rect width="360" height="48" rx="10" fill="#14121f" stroke="#352f52"/>
      <text x="18" y="31" fill="#8f86c2">$</text><text x="40" y="31" fill="#f1eefc">uv tool install notegen</text>
    </g>
    <text y="334" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="15" fill="#8f86c2">Groq · Gemini · Anthropic · OpenAI · Ollama</text>
  </g>
  <g transform="translate(600 40)" font-family="ui-monospace,SFMono-Regular,Menlo,monospace">
    <rect width="536" height="340" rx="14" fill="#14121f" stroke="#352f52"/>
    <text x="24" y="34" font-size="14" fill="#8f86c2">Attention Is All You Need.md</text>
    <path d="M0 50 H536" stroke="#352f52"/>
    <g font-size="15">
      <text x="24" y="82" fill="#6b6494">---</text>
      <text x="24" y="106"><tspan fill="#a78bfa">title:</tspan> <tspan fill="#f1eefc">Attention Is All You Need</tspan></text>
      <text x="24" y="130"><tspan fill="#a78bfa">source:</tspan> <tspan fill="#f1eefc">youtube.com/watch?v=…</tspan></text>
      <text x="24" y="154"><tspan fill="#a78bfa">tags:</tspan> <tspan fill="#f1eefc">[transformers, nlp]</tspan></text>
      <text x="24" y="178" fill="#6b6494">---</text>
      <text x="24" y="214" font-size="19" font-weight="700" fill="#f1eefc" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif"># Self-attention</text>
      <text x="24" y="242" fill="#c4bde6" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="17">Each token attends to every other via <tspan fill="#a78bfa" text-decoration="underline">[[Query-Key-Value]]</tspan>.</text>
    </g>
    <rect x="24" y="262" width="488" height="52" rx="10" fill="#2a2347"/><rect x="24" y="262" width="4" height="52" rx="2" fill="#a78bfa"/>
    <text x="44" y="284" font-size="14" font-weight="700" fill="#a78bfa">&gt; [!TIP]</text>
    <text x="44" y="304" font-size="14" fill="#c4bde6">Scale scores by 1/√d to keep softmax gradients stable.</text>
    <text x="512" y="332" text-anchor="end" font-size="12" fill="#6b6494">illustrative</text>
  </g>
</svg>
